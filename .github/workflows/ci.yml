name: verify
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q qxvision training

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build Android
        run: |
          set +e
          gradle test assembleDebug --stacktrace --console=plain 2>&1 | tee gradle-ci.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -80 gradle-ci.log
            summary=$(grep -E '(^e:|error:|FAILURE:|What went wrong|Execution failed|Caused by:)' gradle-ci.log | tail -40 | tr '\n' ' ' | cut -c1-6000)
            echo "::error title=Gradle build failure::$summary"
            exit "$status"
          fi
      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-diagnostics
          path: |
            gradle-ci.log
            app/build/reports
          if-no-files-found: ignore
      - name: Verify debug APK and manifest package
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          apkanalyzer manifest application-id app/build/outputs/apk/debug/app-debug.apk | grep -Fx ai.qxvision.signal
          apkanalyzer manifest version-name app/build/outputs/apk/debug/app-debug.apk | grep -Fx 1.0.0
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: qx-vision-signal-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
